[project]
name = "nclex-daily-api"
version = "0.1.0"
description = "FastAPI backend for NCLEX Daily"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.13.3",
    "fastapi==0.115.2",
    "httpx==0.27.2",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.6.0",
    "SQLAlchemy==2.0.36",
    "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q --basetemp=.pytest_tmp"
